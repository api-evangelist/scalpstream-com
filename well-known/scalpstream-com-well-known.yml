source: live probes of /.well-known/ on scalpstream.com, www.scalpstream.com and the five agent hosts (plus the tradescout alias), 2026-09-19
summary: >-
  Real documents are served on every agent host and none on the apex/marketing host. Each of
  recallscout., airscout., borderscout., fuelscout. and feed.scalpstream.com serves an A2A agent
  card at the canonical /.well-known/agent-card.json, the identical card at the legacy
  /.well-known/agent.json, and an x402 payment-discovery document at /.well-known/x402 - three
  genuine JSON documents per host, fifteen in all (plus the tradescout alias). Nothing else is
  served anywhere: no security.txt (so NO SecurityTxt pointer), no openid-configuration, no
  oauth-authorization-server, no oauth-protected-resource (consistent with the keyless x402
  model - there is no OAuth anywhere), no api-catalog, no ai-plugin.json, no ucp/acp/aauth, and
  no apis.json. The apex host scalpstream.com is a Wix site whose /.well-known/* answers are Wix
  400/404 error shells, recorded as misses. The Wix Site MCP endpoint (www.scalpstream.com/_api/mcp,
  see mcp/) is on the www host, which is why www is probed as the MCP host per RFC 9728 - it
  serves no protected-resource metadata either.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the fifteen 200 application/json documents on the
  five agent hosts. SecurityTxt pointer NOT emitted - RFC 9116 is unimplemented on every host.
false_positive_watch: >-
  www.scalpstream.com answers HTTP 400 (2,203-byte Wix "Bad Request" HTML) for every
  /.well-known/* path and 404 HTML for other unknown paths; the apex 301s to www. Neither is a
  document. The agent hosts return clean 0-byte 404s for unknown paths, so their 200s are real.
