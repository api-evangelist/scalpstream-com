description: >-
  ScalpStream serves FIVE distinct A2A Agent Cards from five hosts under its own registrable
  domain (scalpstream.com), every one fetched verbatim on 2026-09-19 - nothing here is generated
  or derived. The primary card is RecallScout (the agent the a2aregistry.org harvest surfaced);
  the other four are AirScout, BorderScout, FuelScout and ScalpStream Research (served from
  feed.scalpstream.com, and byte-identically from the alias host tradescout.scalpstream.com).
  All five are the same template: protocolVersion 0.3.0, preferredTransport JSONRPC, a JSON-RPC
  endpoint at /a2a on the same host, an empty security[] (the A2A endpoint is free), and an
  a2a-x402 v0.1 capability extension declaring that paid DATA settles over HTTP 402 at a sibling
  REST resource (/recalls, /air, /crossings, /fuel, /picks) at $0.01 per request. All five grade
  conformant against A2A 1.0.0. Each host also serves the identical card at the legacy
  /.well-known/agent.json path. The operator's GitHub account (DV1-321) publishes a companion
  repo, agent-cards, that exists solely to prove namespace ownership of these five agents to
  registries and states that the live hosts above are the source of truth.
