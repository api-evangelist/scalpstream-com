method: searched
status: published
source: https://github.com/DV1-321/scalpstream-mcp (README + go.mod + proxy.golang.org metadata) and a live tools/list probe of https://www.scalpstream.com/_api/mcp
summary: >-
  Two MCP surfaces exist and they are different things. (1) FIRST-PARTY, LOCAL-STDIO: the operator
  publishes `scalpstream-mcp`, a Go MCP server (binary `scalpmcp`) that a user installs and runs
  locally; it wraps the five x402 data services and pays for each call from the user's own
  wallet (USDC on Base), with hard per-call and per-process spend caps; with no key configured
  every paid tool returns the free preview plus the quoted price. Ownership is established by the
  sibling repo DV1-321/agent-cards, which exists to prove that GitHub account's namespace over the
  ScalpStream agents. (2) PLATFORM-AUTHORED, REMOTE: www.scalpstream.com/_api/mcp is the Wix Site
  MCP that Wix serves for every Wix site; tools/list answered 200 with Wix's generic 9-tool set
  (GetBusinessDetails, SearchInSite, CallWixSiteAPI ...). It is reachable and unauthenticated, but
  it exposes the marketing site, not the data APIs, and the operator did not write it - recorded
  so the difference is visible, not credited as an operator-built remote server.
deployment:
  mode: local-stdio
  endpoint: null
  install: go install github.com/DV1-321/scalpstream-mcp/cmd/scalpmcp@latest
  package: https://pkg.go.dev/github.com/DV1-321/scalpstream-mcp
  auth: none
  verified: searched
  note: >-
    No hosted https endpoint for the first-party server is published anywhere (README, agent
    cards, x402 docs, llms.txt all point only at the local binary). The MCP client config is
    {"command":"scalpmcp","env":{EVM_BASE_PRIVATE_KEY, SCALPMCP_MAX_PRICE_USD, SCALPMCP_BUDGET_USD}}
    - omit env entirely for preview-only mode. verified: searched (read from the repo and Go
    module proxy, not executed).
server:
  name: scalpstream
  binary: scalpmcp
  transport: stdio
  language: Go
  module: github.com/DV1-321/scalpstream-mcp
  version: v0.1.6
  published: '2026-09-08'
  license: MIT
  repository: https://github.com/DV1-321/scalpstream-mcp
payments:
  model: x402 (client-side)
  note: >-
    The server pays sellers per call from the user's Base-mainnet key held in process memory;
    gas is facilitator-sponsored so the wallet needs only USDC. Defaults SCALPMCP_MAX_PRICE_USD
    0.10 and SCALPMCP_BUDGET_USD 2.00 are enforced before signing; an unset limit means the
    default, never unlimited; spend is recorded only when data is delivered.
