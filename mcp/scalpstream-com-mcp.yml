tools_note: >-
  Tool names and descriptions are transcribed from the repository README's Tools table; input
  schemas were not enumerated (that requires installing and running the binary). RecallScout is
  NOT among the eight tools in the v0.1.6 README even though it is one of the five A2A agents -
  recorded as a gap between the MCP surface and the A2A surface, not corrected.
platform_servers:
- name: Wix Site MCP (platform-authored)
  authored_by: Wix
  mode: remote
  endpoint: https://www.scalpstream.com/_api/mcp
  transport: streamable-http
  auth: none
  verified: probed
  probe:
    method: tools/list
    http_status: 200
    content_type: application/json; charset=utf-8
    mcp_session_id_header: present
    tool_count: 9
    tools: [ReadFullDocsArticle, ReadFullDocsMethodSchema, BrowseWixRESTDocsMenu, CallWixSiteAPI, GenerateVisitorToken, SearchSiteApiDocs, GetBusinessDetails, SearchInSite, ExecuteWixAPI]
    file: scalpstream-com-wix-site-mcp-tools.json
  advertised_in: https://scalpstream.com/llms.txt (Wix auto-generated llms.txt)
  note: >-
    Byte-identical to the Wix tool set found on 38 other Wix tenants in the catalog (see the
    platform-authorship audit). It serves site content and Wix business APIs for the marketing
    site; none of the five data services are reachable through it. Not the provider's server.
