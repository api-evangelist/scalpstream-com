aid: scalpstream-com
name: ScalpStream
description: >-
  ScalpStream operates a family of machine-payable data APIs built for autonomous agents:
  RecallScout (active US FDA, NHTSA and CPSC recalls with severity normalised across the three
  regulators), AirScout (global air quality with an EPA-based outdoor-exertion verdict and the
  cleanest window ahead), BorderScout (all 85 US ports of entry ranked by drive-plus-wait
  time per lane), FuelScout (cheapest fuel - station-level for Spain, France and Italy,
  official regional averages for the US) and ScalpStream Research (impersonal ranked options,
  dividend, crypto and yield feeds). Every service is a plain HTTPS GET priced at a flat $0.01
  per request and settled per request over x402 (HTTP 402) in USDC on Base, Arbitrum or
  Polygon or XRP/RLUSD on the XRP Ledger - no accounts, no API keys, no subscriptions - with a
  free preview on every host, an A2A agent card and JSON-RPC endpoint per service, and a
  first-party local MCP server (scalpmcp) that buys from all of them with the user's own wallet.
