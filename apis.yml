- name: ScalpStream Research
  image: https://feed.scalpstream.com/icon.png
  description: >-
    Machine-payable, impersonal research feeds over x402: ranked 0-30 DTE options candidates
    (/picks), dividend and tax-free municipal income (/dividends), crypto scalp candidates
    (/crypto) and risk-adjusted crypto yields (/yields). Built to be polled - free previews carry
    a board fingerprint served as a weak HTTP ETag so an agent can learn the board has changed
    with a 304 before paying, and /schema publishes JSON Schema 2020-12 for every paid response.
    Paid requests require the header X-Compliance-Attestation. Not investment advice.
  humanURL: https://feed.scalpstream.com/
  baseURL: https://feed.scalpstream.com
  tags: [Market Research, Options, Dividends, Cryptocurrency, DeFi, Trading Signals, x402, A2A]
