apis:
- name: RecallScout
  image: https://recallscout.scalpstream.com/icon.png
  description: >-
    Machine-payable US recall lookups over x402. Given a product, brand, ingredient or vehicle
    (make/model/year), returns active recalls across FDA food/drug/device enforcement, NHTSA
    vehicle safety campaigns and CPSC consumer recalls in one query, with severity normalised
    onto one scale and the basis for each rating stated, plus hazard, remedy and the lot codes /
    UPCs needed to tell whether a specific unit is affected. $0.01 per request; free preview.
  humanURL: https://recallscout.scalpstream.com/
