- name: AirScout
  image: https://airscout.scalpstream.com/icon.png
  description: >-
    Machine-payable air-quality queries over x402 with global coverage: current US AQI and
    pollutant breakdown for a lat/lon, an EPA (AirNow) based verdict on whether it is safe to
    exercise outdoors, and the cleanest contiguous window in the next 7 days for a session of a
    given length. Modelled data (Copernicus CAMS via Open-Meteo), not a street-level sensor.
    $0.01 per request; free preview.
  humanURL: https://airscout.scalpstream.com/
