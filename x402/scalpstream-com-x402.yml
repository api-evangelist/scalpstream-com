summary: >-
  Every paid resource ScalpStream advertises answers a REAL x402 v2 challenge: HTTP 402,
  Content-Type application/json, a base64url PAYMENT-REQUIRED response header carrying the
  x402Version 2 envelope, a legacy X-PAYMENT-REQUIRED header carrying a single XRPL quote, and a
  JSON body that repeats the envelope and adds an `extensions.bazaar` block - a provider-published
  input/output description of the resource (HTTP method, example queryParams, an example output
  and a JSON Schema of the paid response). This is the pipeline's x402 rule satisfied the right
  way: the probe hit the documented operation path, not the base URL, and the negative control
  (an unknown path on the same host) returned a clean 404. No payTo/asset values here are
  secrets - they are the seller's public receiving addresses as served. Per-request fields
  (invoiceId, sig, expiresAt) are whatever the server minted for this probe and expire in 60s.
protocol:
  name: x402
  version: 2
  headers_observed: [payment-required, x-payment-required, access-control-expose-headers, content-security-policy, strict-transport-security, x-content-type-options, x-frame-options, referrer-policy]
  rate_limit_headers_observed: []
  scheme: exact
  max_timeout_seconds: 60
  quote_ttl: expiresAt is ~60s after issue (invoice-bound quote)
  accepts_rails:
