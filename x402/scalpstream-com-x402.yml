  - {network: 'xrpl:0', asset: RLUSD (issuer rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De), amount: '0.01'}
  price_usd_per_request: '0.01'
  bazaar_extension: >-
    extensions.bazaar in each 402 body carries description, info.input {type http, method GET,
    queryParams example}, info.output {type json, format application/json, example} and schema
    (a JSON Schema object for the paid response). This is the closest thing to a machine-readable
    contract these REST resources publish - there is no OpenAPI - and it is saved verbatim in
    the challenge files rather than re-authored.
